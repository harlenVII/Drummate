name: Firestore Daily Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 2:00 AM UTC
  workflow_dispatch:       # Allows manual trigger from GitHub UI

permissions:
  contents: read
  id-token: write          # Required for Workload Identity

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/106686356467/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'firebase-backup-sa@project-aacb199d-df56-4bf1-824.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firestore Export
        run: |
          TIMESTAMP=$(date +%Y-%m-%dT%H-%M-%S)
          gcloud firestore export gs://drummate-firebase-backup/backups/$TIMESTAMP \
            --project=drummate-c673d